<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japanese Flashcards</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">Japanese study deck</p><h1>Flashcards</h1><p id="status">Finding vocabulary files...</p></div><button id="theme" aria-label="Toggle theme">☾</button></header><section class="selector"><label for="deckSelect">Vocabulary list</label><select id="deckSelect" disabled><option>Loading...</option></select><button id="refresh">Refresh list</button></section><section class="toolbar"><input id="search" placeholder="Search kanji, reading, English or Sinhala"><button id="shuffle">Shuffle</button></section><section class="study"><button id="prev" class="nav">‹</button><article id="card" class="card" tabindex="0"><div class="face front"><span id="number"></span><div id="kanji" class="kanji">Loading</div><p>Click to reveal</p></div><div class="face back"><div id="reading" class="reading"></div><div class="meaning"><strong>English</strong><span id="english"></span></div><div class="meaning"><strong>සිංහල</strong><span id="sinhala"></span></div></div></article><button id="next" class="nav">›</button></section><section class="actions"><button id="speak">▶ Pronounce</button><button id="export">Export selected TXT</button></section><p class="note">Every repository file whose name starts with <code>vocabulary</code> and ends with <code>.txt</code> appears automatically.</p></main><script src="app.js"></script></body></html>
