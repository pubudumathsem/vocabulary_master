<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japanese Flashcards</title><style>
:root{--bg:#f7f7f4;--card:#fff;--txt:#10140f;--mut:#667066;--accent:#227a43;--border:#dfe5df}body.dark{--bg:#0d120f;--card:#161d18;--txt:#f2f6f2;--mut:#aab5ac;--accent:#55c77c;--border:#2d3931}body.green{--bg:#eaf5ec;--card:#f8fff8;--txt:#103719;--mut:#52735b;--accent:#16763a;--border:#bad5c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:22px}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}select,button{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit}button{cursor:pointer}.card{margin:45px 0 20px;min-height:330px;background:var(--card);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px;box-shadow:0 10px 35px #00000010;cursor:pointer}.kanji{font-size:clamp(48px,10vw,74px);font-weight:700}.reading{font-size:24px;color:var(--accent);margin-top:9px}.meaning{font-size:24px;margin-top:22px;display:none}.card.reveal .meaning{display:block}.small{color:var(--mut);font-size:14px}.nav{display:flex;justify-content:center;gap:12px}.nav button{min-width:110px}.status{text-align:center;color:var(--mut);margin:13px}.empty{color:var(--mut)}
</style></head><body><div class="app"><div class="top"><div><b>日本語 Flashcards</b><div class="small">Click the card to show meaning</div></div><div><select id="deck"></select> <select id="theme"><option value="white">White</option><option value="green">Green</option><option value="dark">Black / Dark</option></select></div></div><div id="card" class="card"><div id="kanji" class="kanji empty">Loading vocabulary…</div><div id="reading" class="reading"></div><div id="meaning" class="meaning"></div></div><div class="nav"><button id="prev">← Previous</button><button id="shuffle">Shuffle</button><button id="next">Next →</button></div><div id="status" class="status"></div></div><script>
const state={decks:[],cards:[],i:0}; const $=id=>document.getElementById(id);
function parse(t){return t.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.toLowerCase().startsWith('number|')&&x.includes('|')).map(x=>{let [number,kanji,reading,english,sinhala]=x.split('|').map(s=>s.trim());return {number,kanji,reading,english,sinhala}}).filter(x=>x.kanji)}
async function discover(){let names=[];try{let r=await fetch('vocab-files.json',{cache:'no-store'});if(r.ok)names=await r.json()}catch(e){} if(!names.length)names=['vocabulary.txt']; names=names.filter(n=>/^vocab.*\.txt$/i.test(n)); for(const n of names){try{let r=await fetch(n,{cache:'no-store'});if(r.ok)state.decks.push({name:n,cards:parse(await r.text())})}catch(e){}} let d=$('deck');d.innerHTML=state.decks.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('');load(0)}
function load(n){state.cards=state.decks[n]?.cards||[];state.i=0;draw()} function draw(){let c=state.cards[state.i];$('card').classList.remove('reveal');if(!c){$('kanji').textContent='No vocabulary found';$('reading').textContent='';$('meaning').textContent='';$('status').textContent='';return}$('kanji').textContent=c.kanji;$('reading').textContent=c.reading;$('meaning').innerHTML=`<b>${c.english}</b><br><span class="small">${c.sinhala||''}</span>`;$('status').textContent=`${state.i+1} / ${state.cards.length}`}
$('card').onclick=()=> $('card').classList.toggle('reveal');$('next').onclick=()=>{if(state.cards.length){state.i=(state.i+1)%state.cards.length;draw()}};$('prev').onclick=()=>{if(state.cards.length){state.i=(state.i-1+state.cards.length)%state.cards.length;draw()}};$('shuffle').onclick=()=>{if(state.cards.length){state.i=Math.floor(Math.random()*state.cards.length);draw()}};$('deck').onchange=e=>load(+e.target.value);$('theme').onchange=e=>{document.body.className=e.target.value==='white'?'':e.target.value;localStorage.theme=e.target.value};let t=localStorage.theme||'white';$('theme').value=t;document.body.className=t==='white'?'':t;discover();
</script></body></html>
