<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JLPT Vocabulary Flashcards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Japanese study deck</p>
                <h1 id="deckTitle">JLPT Vocabulary Flashcards</h1>
                <p id="progress" aria-live="polite">Loading vocabulary...</p>
            </div>
            <button id="theme" aria-label="Toggle theme" title="Toggle dark mode">☾</button>
        </header>

        <section class="toolbar" aria-label="Vocabulary controls">
            <label class="deck-picker" for="vocabularySelect">
                <span>Select vocabulary file</span>
                <select id="vocabularySelect" disabled>
                    <option>Loading files...</option>
                </select>
            </label>
            <input id="search" type="search" placeholder="Search kanji, reading, English or Sinhala" aria-label="Search vocabulary" disabled>
        </section>

        <section class="study" aria-label="Flashcards">
            <button id="prev" class="nav" aria-label="Previous card">‹</button>
            <article id="card" class="card" tabindex="0" role="button" aria-label="Flashcard. Click or press Enter to reveal the answer">
                <div class="face front">
                    <span id="number"></span>
                    <div id="kanji" class="kanji">Loading...</div>
                    <p>Click to reveal</p>
                </div>
                <div class="face back">
                    <div id="reading" class="reading"></div>
                    <div class="meaning">
                        <strong>English</strong>
                        <span id="english"></span>
                    </div>
                    <div class="meaning">
                        <strong>සිංහල</strong>
                        <span id="sinhala"></span>
                    </div>
                </div>
            </article>
            <button id="next" class="nav" aria-label="Next card">›</button>
        </section>

        <section class="actions">
            <button id="speak">▶ Pronounce</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
